name: Quarto Branch Preview

on:
  push:
    branches-ignore:
      - main
  delete:

permissions:
  contents: write

jobs:
  preview:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev libxml2-dev

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Compile APSIMX
        uses: byzheng/apsimx-actions@main

      - name: Cache build state
        uses: actions/cache@v4
        with:
          path: |
            _freeze
            _site
            .quarto
            _targets
          key: build-${{ github.ref }}-${{ hashFiles('**/*.qmd') }}
          restore-keys: |
            build-${{ github.ref }}-

      - name: Render docs
        run: Rscript _build.R

      - name: Deploy branch preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          destination_dir: branch/${{ github.ref_name }}
          keep_files: true

  cleanup:
    if: github.event_name == 'delete'
    runs-on: ubuntu-latest
    steps:
      - name: Remove branch preview from gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: branch/${{ github.ref_name }}
          keep_files: false
